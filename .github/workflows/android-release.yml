# Gera o Android App Bundle (AAB) assinado para a Google Play.
# Pré-requisito: criar os 4 "secrets" do repositório descritos em ANDROID.md (seção Assinatura).
# Uso: Actions → "Android — AAB de produção" → Run workflow.
name: Android — AAB de produção

on:
  workflow_dispatch:

jobs:
  aab-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # o runner ubuntu-latest já traz o Android SDK (ANDROID_HOME); o AGP baixa a plataforma 36 se faltar
      - name: Conferir Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && test -d "$ANDROID_HOME"
      - run: npm ci
      - run: npm run sync
      - name: Restaurar chave de upload (dos secrets)
        env:
          KEYSTORE_B64: ${{ secrets.FF_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secret FF_UPLOAD_KEYSTORE_BASE64 não configurado"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "FF_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Compilar AAB assinado
        working-directory: android
        env:
          FF_UPLOAD_STORE_PASSWORD: ${{ secrets.FF_UPLOAD_STORE_PASSWORD }}
          FF_UPLOAD_KEY_ALIAS: ${{ secrets.FF_UPLOAD_KEY_ALIAS }}
          FF_UPLOAD_KEY_PASSWORD: ${{ secrets.FF_UPLOAD_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: flow-factory-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
